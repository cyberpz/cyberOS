# Picom cyber theme - configurazione leggera
backend = "xrender";
vsync = false;

# Ombre
shadow = true;
shadow-radius = 8;
shadow-offset-x = -4;
shadow-offset-y = -4;
shadow-opacity = 0.4;
shadow-color = "#000000";

# Fade
fading = true;
fade-delta = 6;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Trasparenza leggera
inactive-opacity = 0.97;
frame-opacity = 0.95;
inactive-opacity-override = false;

# Disabilita per finestre fullscreen
focus-exclude = [ "class_g = 'i3lock'" ];

# Cornici
corner-radius = 0;

# Performance
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-ewmh-active-win = true;

# Disabilita notifiche e dock dalle ombre/trasparenze
shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'i3lock'"
];

opacity-rule = [
    "100:class_g = 'i3lock'"
];
