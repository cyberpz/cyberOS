;==========================================================
; Polybar cyber compact con emoji
;==========================================================

[colors]
background = #0a0a1c
background-alt = #15152b
foreground = #c7c7d9
primary = #00ff41
secondary = #6b6b8a
alert = #ff3b3b
disabled = #6b6b8a

[bar/cyber]
width = 100%
height = 22pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
border-size = 0

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = JetBrains Mono:size=10;2
font-1 = Noto Color Emoji:scale=10;2

modules-left = cyberlogo xworkspaces
modules-right = kdeconnect wireguard bluetooth battery fs vol mem memfree cpu load date

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; Barra principale gestita da i3 (dock), rimane sopra le finestre
override-redirect = false
wm-restack = i3

[bar/cyber-hover]
width = 100%
height = 22pt
radius = 0

offset-y = 22pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
border-size = 0

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = JetBrains Mono:size=10;2
font-1 = Noto Color Emoji:scale=10;2

modules-left = xwindow
modules-right = netinfo date-ext

cursor-click = pointer
enable-ipc = true
override-redirect = true

[module/cyberlogo]
type = custom/text
format = "Cyber.Pz"
format-foreground = ${colors.primary}
format-background = ${colors.background-alt}
format-padding = 2

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/battery]
type = custom/script
exec = /home/user/.local/bin/polybar-battery.sh
interval = 5

[module/fs]
type = internal/fs
interval = 25
mount-0 = /
format-mounted-prefix = "💾 "
format-mounted-prefix-font = 2
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %percentage_used%%
label-mounted-foreground = ${colors.primary}
label-unmounted = off
label-unmounted-foreground = ${colors.disabled}

[module/vol]
type = internal/pulseaudio
format-volume-prefix = "🔊 "
format-volume-prefix-font = 2
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.primary}
label-muted = "🔇 mute"
label-muted-font = 2
label-muted-foreground = ${colors.disabled}

[module/mem]
type = internal/memory
interval = 2
format-prefix = "🧠 "
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label = %percentage_used%%
label-foreground = ${colors.primary}

[module/memfree]
type = custom/script
exec = /home/user/.local/bin/polybar-memfree.sh
interval = 2
format-prefix = "🆓 "
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label-foreground = ${colors.primary}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "⚡ "
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label = %percentage%%
label-foreground = ${colors.primary}

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
format-prefix = "🕒 "
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label = %date%
label-foreground = ${colors.primary}

[module/xwindow]
type = internal/xwindow
label = %title%
label-maxlen = 60
label-empty = "Nessuna finestra"
label-empty-foreground = ${colors.disabled}

[module/date-ext]
type = internal/date
interval = 1
date = "%a %d %b %Y %H:%M:%S"
format-prefix = "📅 "
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label = %date%

[module/netinfo]
type = custom/script
exec = /home/user/.local/bin/polybar-netinfo.sh
interval = 5
format-prefix = "🌐 "
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}

[module/load]
type = custom/script
exec = awk '{print $1}' /proc/loadavg
interval = 5
format-prefix = "🔥 "
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}

[module/wireguard]
type = custom/script
exec = /home/user/.local/bin/polybar-wireguard.sh
interval = 2
format-prefix = ""
format = <label>
label = %output%
label-foreground = ${colors.primary}
cursor-click = pointer

[module/bluetooth]
type = custom/script
exec = /home/user/.local/bin/polybar-bluetooth.sh
interval = 5
format-prefix = ""
format = <label>
label = %output%
cursor-click = pointer
click-right = /home/user/.local/bin/bluetooth-menu.sh

[module/kdeconnect]
type = custom/script
exec = /home/user/.local/bin/polybar-kdeconnect.sh
interval = 5
format-prefix = ""
format = <label>
label = %output%
cursor-click = pointer
click-left = /home/user/.local/bin/polybar-kdeconnect.sh open
click-right = /home/user/.local/bin/kdeconnect-menu.sh

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
